dessus des champs.":"The sun is setting. War falcons circle above the fields.","Les champs pi\xE9tin\xE9s":"The Trampled Fields","L'arm\xE9e a tout pi\xE9tin\xE9 et br\xFBl\xE9 les meules. La fum\xE9e cache l'horizon.":"The army trampled everything and burned the haystacks. Smoke hides the horizon.","La nuit du si\xE8ge":"The Night of the Siege","Les feux du camp ennemi brillent dans la nuit. Les chevaliers chargent vers le cristal.":"The enemy campfires glow in the night. The knights charge toward the crystal.","Le camp de Varek":"Varek's Camp","Le seigneur de guerre Varek sort de sa tente. Bats-le pour lib\xE9rer la plaine.":"The warlord Varek steps out of his tent. Defeat him to free the plain.","Le Ch\xE2teau de Corvin":"Corvin Castle","Les derniers soldats de Varek se replient dans le ch\xE2teau du baron Corvin. Il faut quitter la plaine et entrer dans la forteresse.":"Varek's last soldiers fall back into Baron Corvin's castle. You must leave the plain and enter the fortress.","La route du ch\xE2teau":"The Castle Road","Varek est vaincu. Ses soldats fuient vers le ch\xE2teau du baron. La route quitte la plaine.":"Varek is defeated. His soldiers flee toward the baron's castle. The road leaves the plain.","Les douves":"The Moat","Le ch\xE2teau se dresse devant toi. Des gardes patrouillent le long des douves.":"The castle looms before you. Guards patrol along the moat.","Le pont-levis":"The Drawbridge","Le pont-levis est baiss\xE9. Force l'entr\xE9e sans laisser tomber le cristal.":"The drawbridge is down. Force your way in without letting the crystal fall.","La basse-cour":"The Courtyard","\xC9curies, puits et chiens de garde : la cour du ch\xE2teau se r\xE9veille.":"Stables, wells and guard dogs: the castle courtyard is waking up.","Les remparts":"The Ramparts","Sur le chemin de ronde, le vent siffle. Des chauves-souris quittent les tours.":"On the battlements the wind whistles. Bats leave the towers.","La forge":"The Forge","Les forgerons du baron \xE9quipent ses chevaliers noirs. Les braises volent.":"The baron's smiths equip his black knights. Embers fly.","La grande salle":"The Great Hall","Les tables du festin sont renvers\xE9es. La garde du baron t'attend.":"The feast tables are overturned. The baron's guard awaits you.","Les cachots":"The Dungeons","Sous le ch\xE2teau, l'eau suinte des murs. Le bourreau r\xF4de dans le noir.":"Beneath the castle, water seeps from the walls. The executioner prowls in the dark.","La salle du tr\xF4ne":"The Throne Room","Le baron Corvin se l\xE8ve de son tr\xF4ne. C'est lui qui a arm\xE9 Varek.":"Baron Corvin rises from his throne. He is the one who armed Varek.","Les Grottes de Morn":"The Caves of Morn","Sous le ch\xE2teau, un passage descend dans la roche. Les cr\xE9atures des profondeurs se r\xE9veillent et gardent le chemin.":"Beneath the castle, a passage descends into the rock. The creatures of the deep awaken and guard the way.","La sortie des cachots":"The Dungeon Exit","Les derniers pav\xE9s du ch\xE2teau laissent place \xE0 la roche brute. Des kobolds r\xF4dent dans le noir.":"The last cobblestones of the castle give way to bare rock. Kobolds prowl in the dark.","Les galeries":"The Galleries","Des torches \xE9teintes jalonnent les galeries. Des araign\xE9es filent entre les rochers.":"Dead torches line the galleries. Spiders scuttle between the rocks.","La mine abandonn\xE9e":"The Abandoned Mine","Des wagonnets rouill\xE9s et des tonneaux oubli\xE9s. Les golems gardent les filons.":"Rusty carts and forgotten barrels. Golems guard the veins.","Le lac souterrain":"The Underground Lake","Une eau noire et immobile. Quelque chose bouge \xE0 la surface.":"Still, black water. Something moves on the surface.","La for\xEAt de champignons":"The Mushroom Forest","Des champignons g\xE9ants brillent dans l'obscurit\xE9. Leurs spores flottent dans l'air.":"Giant mushrooms glow in the darkness. Their spores drift through the air.","La caverne de cristal":"The Crystal Cavern","Des cristaux bleus \xE9clairent la caverne. Leur lumi\xE8re attire les ogres.":"Blue crystals light up the cavern. Their glow attracts ogres.","Les toiles":"The Webs","Des toiles couvrent les parois. Il ne faut pas r\xE9veiller ce qui les a tiss\xE9es.":"Webs cover the walls. Do not wake whatever spun them.","Le gouffre":"The Chasm","Le sol s'ouvre sur un vide sans fond. Le basilic remonte des profondeurs.":"The ground opens onto a bottomless void. The basilisk rises from the depths.","Le nid de la reine":"The Queen's Nest","La reine araign\xE9e garde ses \u0153ufs. Il faut la vaincre pour revoir le jour.":"The spider queen guards her eggs. You must defeat her to see daylight again.","Le D\xE9sert d'Ambre":"The Amber Desert","Au bout des grottes, la lumi\xE8re revient : un d\xE9sert br\xFBlant s'\xE9tend jusqu'aux montagnes du dragon.":"At the end of the caves, the light returns: a scorching desert stretches to the dragon's mountains.","Le bout du tunnel":"The End of the Tunnel","La roche laisse place au sable. Des pillards guettent la sortie des grottes.":"The rock gives way to sand. Raiders watch the cave exit.","Le canyon rouge":"The Red Canyon","Les parois du canyon br\xFBlent au soleil. Les hy\xE8nes chassent en meute.":"The canyon walls burn in the sun. Hyenas hunt in packs.","Les dunes":"The Dunes","Le vent sculpte les dunes. Des scorpions g\xE9ants s'y enfouissent.":"The wind sculpts the dunes. Giant scorpions burrow into them.","L'oasis":"The Oasis","Une oasis, enfin. Mais l'eau attire aussi les monstres.":"An oasis, at last. But the water attracts monsters too.","La caravane pill\xE9e":"The Plundered Caravan","Les tentes de la caravane sont vides. Les vautours tournent au-dessus.":"The caravan's tents are empty. Vultures circle above.","Les ruines englouties":"The Sunken Ruins","Les colonnes d'un temple oubli\xE9 sortent du sable. Des golems de sable s'y rel\xE8vent.":"The columns of a forgotten temple rise from the sand. Sand golems rise from it.","La temp\xEAte de sable":"The Sandstorm","Le ciel devient orange. La temp\xEAte cache les ennemis jusqu'au dernier moment.":"The sky turns orange. The storm hides the enemies until the last moment.","La vall\xE9e des os":"The Valley of Bones","Des squelettes g\xE9ants dorment dans la vall\xE9e. La momie royale s'\xE9veille.":"Giant skeletons sleep in the valley. The royal mummy awakens.","Le repaire du ver":"The Worm's Lair","Le sol tremble. Le ver des sables surgit pour d\xE9fendre son territoire.":"The ground trembles. The sand worm bursts out to defend its territory.","L'Antre du Dragon":"The Dragon's Lair","Au-del\xE0 du d\xE9sert se dresse le volcan. C'est l\xE0 que dort le Dragon noir, entour\xE9 de ses enfants.":"Beyond the desert rises the volcano. This is where the Black Dragon sleeps, surrounded by his children.","Le pied du volcan":"The Foot of the Volcano","Le sable devient cendre noire. Les gobelins du dragon gardent la mont\xE9e.":"The sand turns to black ash. The dragon's goblins guard the climb.","Les coul\xE9es de lave":"The Lava Flows","La lave coule entre les rochers. Les loups du volcan courent sur la pierre br\xFBlante.":"Lava flows between the rocks. The volcano wolves run across the burning stone.","La for\xEAt p\xE9trifi\xE9e":"The Petrified Forest","Des arbres chang\xE9s en pierre par le souffle du dragon. Rien ne pousse plus ici.":"Trees turned to stone by the dragon's breath. Nothing grows here anymore.","Le pont d'obsidienne":"The Obsidian Bridge","Un \xE9troit passage de pierre noire au-dessus de la lave. Les orcs le gardent.":"A narrow strip of black stone above the lava. Orcs guard it.","Les nids de wyvernes":"The Wyvern Nests","Des \u0153ufs chauds reposent dans les cendres. Les wyvernes d\xE9fendent leurs nids.":"Warm eggs rest in the ashes. The wyverns defend their nests.","Le cimeti\xE8re des dragons":"The Dragon Graveyard","Les os des anciens dragons couvrent la vall\xE9e. Les trolls y font leur repaire.":"The bones of ancient dragons cover the valley. Trolls make their lair here.","Le tr\xE9sor du dragon":"The Dragon's Treasure","Des montagnes d'or brillent dans la lueur de la lave. Un dragon veille sur le tr\xE9sor.":"Mountains of gold glitter in the lava glow. A dragon watches over the treasure.","Le c\u0153ur du volcan":"The Heart of the Volcano","La chaleur est insoutenable. Le Dragon noir est tout proche.":"The heat is unbearable. The Black Dragon is very close.","L'antre du Dragon noir":"The Black Dragon's Lair","Le Dragon noir ouvre les yeux. Prot\xE8ge le cristal jusqu'au bout.":"The Black Dragon opens his eyes. Protect the crystal to the very end.",Facile:"Easy",Difficile:"Hard","Tour d'archers":"Archer Tower",Rapide:"Fast","Tour de mage":"Mage Tower",Polyvalent:"Versatile",Catapulte:"Catapult",Zone:"Area","Tour de givre":"Frost Tower",Givre:"Frost",Ralentit:"Slows","Tour \xE9lectrique":"Lightning Tower",\u00C9clair:"Lightning","# cibles":"# targets",Baliste:"Ballista","Longue port\xE9e":"Long range","Tour d'alchimiste":"Alchemist Tower",Alchimie:"Alchemy",Rafale:"Barrage","Tous les # tirs, envoie # fl\xE8ches de plus sur des ennemis au hasard":"Every # shots, fires # extra arrows at random enemies","-# % de d\xE9g\xE2ts":"-# % damage",Embuscade:"Ambush","Le premier tir sur chaque nouvel ennemi fait # fois plus de d\xE9g\xE2ts":"The first shot on each new enemy deals # times more damage","-# % de vitesse de tir":"-# % fire rate","Onde de givre":"Frost Wave","Toutes les # s, g\xE8le sur place tous les ennemis \xE0 port\xE9e pendant # s":"Every # s, freezes all enemies in range in place for # s","-# % de port\xE9e":"-# % range","Sillage gel\xE9":"Frozen Wake","Les ennemis touch\xE9s laissent derri\xE8re eux une tra\xEEn\xE9e de glace qui ralentit ceux qui suivent (# %)":"Hit enemies leave an ice trail behind them that slows those that follow (# %)",T\u00E9l\u00E9portation:"Teleportation","# % de chance de renvoyer la cible au portail d'entr\xE9e (sauf boss)":"# % chance to send the target back to the ent
