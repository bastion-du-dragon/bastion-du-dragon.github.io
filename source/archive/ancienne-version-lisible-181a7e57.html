<title>Bastion du Dragon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout : colonne portrait — pastilles de ressources, terrain en grille cerclé d'encre, parchemin de commande en bas. Look unique (jeu), pas de thème sombre. */
:root{
  --bg:#3b2752;
  --bg2:#2c1d3f;
  --ink:#2f1d12;
  --parch:#fbe9c0;
  --parch2:#f3d79a;
  --cream:#fff7e0;
  --fg:#fff4dc;
  --muted:#8a6a48;
  --gold:#ffc93c;
  --red:#ef5a3c;
  --green:#6cc04a;
  --blue:#4fb4ec;
  --teal:#3fe0c5;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg),var(--bg2));color:var(--fg);font-family:var(--body);font-weight:800;font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px}
.hud{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:nowrap;white-space:nowrap}
.pill{display:flex;align-items:center;gap:4px;background:var(--ink);border:2.5px solid #000;border-radius:99px;padding:2px 8px 2px 3px;font-family:var(--display);font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 rgba(255,255,255,.08)}
.pill .ico{width:19px;height:19px;flex:none;display:grid;place-items:center}
.pill .ico svg{width:19px;height:19px}
.pill small{font-family:var(--body);font-size:10px;color:#cdb593;margin-left:-2px}
.spacer{flex:1}
.btn{font-family:var(--display);font-size:16px;color:var(--ink);background:linear-gradient(#fff3cf,#f2cf7c);border:2.5px solid var(--ink);border-radius:12px;padding:5px 10px;cursor:pointer;line-height:1.1;box-shadow:0 3px 0 var(--ink);touch-action:manipulation;letter-spacing:.02em;transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn:disabled{filter:grayscale(.7);opacity:.6;cursor:default}
.btn.lockbtn{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1}.btn.lockbtn .ic{width:18px;height:18px;position:absolute;left:14px;top:50%;transform:translateY(-50%)}.btn.lockbtn{position:relative}.btn.lockbtn small{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:0;opacity:.85}
.btn.go{background:linear-gradient(#ff8a5c,#e2462b);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.green{background:linear-gradient(#9be36c,#4fa83a);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.teal{background:linear-gradient(#8ff5e3,#2bbfa5);color:#0f3b35}
.btn.small{min-width:32px;padding:4px 6px}
.hud .btn{font-size:14px;padding:4px 8px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas#game{display:block;border-radius:16px;border:3px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.35);touch-action:none;cursor:pointer}
canvas#game.blockmode{cursor:crosshair}
.power{position:relative;width:54px;height:54px;flex:none;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 40% 35%,#ffb15c,#e2462b 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:10.5px;letter-spacing:.04em;text-shadow:0 1px 0 rgba(0,0,0,.5);cursor:pointer;box-shadow:0 4px 0 var(--ink);touch-action:manipulation;padding:0;overflow:hidden}
.power svg{width:24px;height:24px;position:relative}
.power span{position:relative}
.power .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.power.armed{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.1);box-shadow:0 4px 0 var(--ink),0 0 0 6px rgba(255,201,60,.6)}}
.power:disabled{cursor:default}
.power:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.gearbtn{display:flex;align-items:center;justify-content:center}.gearbtn svg{display:block}
.actions{flex:none;display:grid;grid-template-columns:auto 1fr 1fr 1.25fr;align-items:center;gap:7px;min-height:58px}
.actions .btn{height:48px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:17px;padding:0 6px;white-space:nowrap;min-width:0}
.actions .act-next{font-size:19px;padding:0 8px;height:52px;flex:1 1 auto;min-width:0;justify-content:center}
.actions .act-tw{padding:0 6px}.actions .act-tw.on,.actions .act-blk.on{background:linear-gradient(#bff59a,#6cc04a)}
.actions .act-zoom{padding:0 8px;font-size:14px;gap:3px}
.actions .bcount{min-width:24px;height:24px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;display:grid;place-items:center;padding:0 5px}
.t-actions .btn{white-space:nowrap}
.banner{position:absolute;left:50%;top:16px;transform:translateX(-50%) rotate(-2deg);font-family:var(--display);font-size:26px;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap;transition:opacity .35s}
.panel{flex:none;height:150px;background:linear-gradient(var(--parch),var(--parch2));color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.45);padding:9px 12px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.p-head{display:flex;align-items:center;gap:8px;min-width:0}
.p-title{font-family:var(--display);font-size:20px;line-height:1;letter-spacing:.01em}
.p-sub{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:1.3}
.enemy-list{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;background:var(--cream);border:2px solid var(--ink);border-radius:99px;padding:1px 8px}
.chip.boss{background:#ffd0c2;color:#9b2410}
.chip.fly{background:#d6efff}
.echip{font:inherit;color:inherit;cursor:pointer;box-shadow:0 2px 0 var(--ink);transition:transform .08s}.echip:active{transform:translateY(2px);box-shadow:none}
.ewave{font-size:13px;color:#6b4a2c}
.row{display:flex;gap:8px;align-items:center}
.row .btn{font-size:14px;padding:6px 10px;display:flex;align-items:center;gap:5px;flex:none}
.row .hint{flex:1;min-width:0}
.cards{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1;min-height:0}
.card{font:inherit;color:var(--ink);background:var(--cream);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px;cursor:pointer;touch-action:manipulation;min-width:0}
.card:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card:disabled{filter:grayscale(.8);opacity:.55;cursor:default}
.card:focus-visible{outline:3px solid var(--blue)}
.card canvas{width:30px;height:30px;flex:none}
.card{position:relative;padding:3px 1px!important;border-radius:10px!important}
.card .n{font-family:var(--display);font-size:11.5px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .r{font-size:9.5px;color:var(--muted);text-align:center;line-height:1.1;display:none}
.card .r.lim{display:block;position:absolute;top:-7px;right:-5px;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 4px;font-size:9.5px;line-height:1.3}
.card .c{font-size:11px!important;gap:2px!important}
.card .c .coin{width:10px;height:10px}
.card .n{font-size:9.5px!important}
.card .c{font-size:13px;display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.coin{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0a8,#ffc93c 55%,#d68a12);border:1.5px solid var(--ink);display:inline-block;flex:none}
.hand{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;min-height:48px}
.pc{flex:none;width:46px;height:46px;border-radius:10px;border:2.5px solid var(--ink);background:var(--cream);box-shadow:0 2px 0 var(--ink);padding:0;cursor:pointer;display:grid;place-items:center}
.pc canvas{width:38px;height:38px}
.pc.on{background:#bff59a;outline:3px solid var(--gold)}
.pc.buy{width:auto;padding:0 8px;display:flex;flex-direction:column;gap:0;font-family:var(--display);font-size:18px;line-height:1}
.pc.buy .c{font-size:12px;display:flex;align-items:center;gap:2px}
.pc:disabled{opacity:.5;cursor:default}
.blk{width:13px;height:13px;border-radius:3px;background:linear-gradient(#f3d08c 60%,#c48f4a 60%);border:1.5px solid var(--ink);display:inline-block;flex:none}
.t-row{display:flex;gap:8px;align-items:center}
.t-row canvas{width:50px;height:50px;flex:none}
.t-info{min-width:0;flex:1}
.t-stats{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.t-stats b{color:var(--ink)}
.t-actions{display:flex;gap:6px}
.t-actions .btn{flex:1;font-size:13.5px;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:4px}
.x{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--red);border:2.5px solid var(--ink);color:#fff;font-family:var(--display);font-size:16px;cursor:pointer;padding:0;line-height:1;box-shadow:0 2px 0 var(--ink);flex:none}
.mini{font-family:var(--display);font-size:12.5px;padding:4px 8px;border-radius:10px}
.overlay{position:fixed;inset:0;background:rgba(30,18,44,.82);padding:16px;z-index:5;overflow:auto}
#tuto{position:fixed;inset:0;z-index:4;pointer-events:none}
#tuto .tspot{position:fixed;border-radius:14px;box-shadow:0 0 0 200vmax rgba(20,10,5,.5);border:3px solid #ffc93c;pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s;animation:tpulse 1.2s ease-in-out infinite}

#tuto.light .tspot{box-shadow:none}
@keyframes tpulse{50%{border-color:#fff3c4;transform:scale(1.03)}}
#tuto .tbub{position:fixed;pointer-events:auto;width:min(330px,calc(100vw - 24px));background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
#tuto .tstep{font-family:var(--display);font-size:13px;letter-spacing:.04em;color:#a0612a}
#tuto p{margin:0;font-size:15px;line-height:1.35;font-weight:700;color:var(--ink)}
#tuto .tbtns{display:flex;justify-content:space-between;gap:8px}#tuto .tbtns .go{margin-left:auto}#tuto .tbtns .btn{font-size:14px;padding:6px 12px}
.tip{background:linear-gradient(#fff8e0,#ffe7a6);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tip b.tt{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.03em}.tip p{margin:0;font-size:14px;line-height:1.35}.tip .btn{align-self:flex-end;font-size:14px;padding:5px 12px}
.sheet{max-width:370px;width:100%;background:linear-gradient(var(--parch),var(--parch2));color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.4);padding:20px 18px;display:flex;flex-direction:column;gap:11px}
.sheet h1,.sheet h2{font-family:var(--display);font-weight:400;margin:0;line-height:.95;text-wrap:balance;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.sheet h1{font-size:44px;color:var(--gold);transform:rotate(-2deg)}
.titlewrap{position:relative}.titlewrap h1{padding-right:96px}
.beta{position:absolute;right:6px;top:50%;transform:translateY(-50%) rotate(8deg);font-family:var(--display);font-size:22px;letter-spacing:.08em;color:#fff;background:linear-gradient(#ff7a5c,#e8452c);border:3px solid var(--ink);border-radius:12px;padding:4px 12px 2px;box-shadow:0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(47,29,18,.55);animation:betabob 2.4s ease-in-out infinite}
@keyframes betabob{50%{transform:translateY(-58%) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.beta{animation:none}}
@media (max-width:390px){.beta{font-size:16px;padding:3px 8px 1px;right:0;border-width:2.5px}.titlewrap h1{padding-right:66px}}
.sheet h2{font-size:34px;color:#ff8f2e;-webkit-text-stroke:2.2px var(--ink);text-shadow:0 3px 0 var(--ink);letter-spacing:.02em}
.top h2{font-size:30px}
.sheet p{margin:0;color:var(--muted);line-height:1.4}

.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px}
.diff .d1{font-size:17px}
.diff .d2{font-family:var(--body);font-size:11px;opacity:.85}
.sheet .btn.big{padding:11px;font-size:20px}
/* Menus hors partie */
.overlay{display:flex;align-items:flex-start;justify-content:flex-start}
.sheet{margin:auto}

.ic{width:15px;height:15px;display:inline-block;flex:none;vertical-align:-2px}
.hero{width:100%;height:auto;aspect-ratio:2/1;max-width:100%;border:3px solid var(--ink);border-radius:16px;background:#86d05a;display:block}
.stack{display:flex;flex-direction:column;gap:9px}

.tbtns2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tinfo .tremove{background:#f3e6c8}.tinfo .tremove.armed{background:#ffd0c2;color:#9b2410}.tinfo .tremove svg,.tinfo .tremove .ic{width:14px;height:14px}.tinfo .hint.small{font-size:12.5px;margin:0}
.tcard .ta .rkreset{font-size:12px;padding:4px 8px;background:#f3e6c8}.tcard .ta .rkreset.armed{background:#ffd0c2;color:#9b2410}.tcard .ta .rkreset .ic,.tcard .ta .rkreset svg{width:14px;height:14px}

/* Lisibilité en partie */
body{font-size:16px}
.app{gap:7px}
.hud{gap:6px}
.pill{font-size:18px;padding:3px 10px 3px 4px}
.pill .ico,.pill .ico svg{width:22px;height:22px}
.pill small{font-size:12px}
.hud .btn{font-size:17px;padding:6px 11px;min-width:42px}
.panel{height:172px;padding:10px 12px;gap:8px}
.p-title{font-size:22px}
.p-sub{font-size:14px}
.hint{font-size:14.5px;line-height:1.35;color:#6b4a2c}
.chip{font-size:14px;padding:2px 9px}
.t-stats{font-size:14.5px;line-height:1.4;color:#6b4a2c}
.t-row canvas{width:56px;height:56px}
.t-actions .btn{font-size:15px;padding:8px 4px}
.x{width:32px;height:32px;font-size:18px}
.mini{font-size:14px;padding:5px 9px}
.cards{display:grid!important;grid-template-columns:repeat(4,1fr);grid-auto-rows:94px;gap:8px 7px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;padding:9px 4px 6px;margin:-5px -4px 0;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#c48f4a transparent;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cards::-webkit-scrollbar{width:6px}.cards::-webkit-scrollbar-thumb{background:#c48f4a;border-radius:4px}
.cards .card{scroll-snap-align:start;scroll-margin-top:9px;justify-content:center;min-width:0}
.cards .card canvas{width:36px;height:36px}
.cardwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.cardwrap .sarr{position:absolute;left:50%;transform:translateX(-50%);z-index:2;height:24px;padding:0 14px;border-radius:12px;border:2.5px solid var(--ink);background:linear-gradient(#fff3cf,#f2cf7c);font-family:var(--display);font-size:14px;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--ink);display:flex;align-items:center;gap:4px;white-space:nowrap}
.cardwrap .sarr.l{top:-4px}.cardwrap .sarr.r{bottom:-6px}
.cardwrap .sarr[hidden]{display:none}
.panel{height:186px}
.card{gap:1px!important;padding:3px 3px 4px!important}
.card canvas{width:30px;height:30px}
.card .n{font-size:13px!important;line-height:1.05;max-width:100%}
.card .c{font-size:14px!important;gap:3px!important}
.card .c .coin{width:12px;height:12px}
.card .r.lim{display:block;position:absolute;top:2px;right:3px;left:auto;background:none;border:0;color:#9b2410;font-size:11px;padding:0;font-family:var(--display)}
.card .r.lim.full{color:#fff;background:var(--red);border-radius:6px;padding:0 3px}
.tkills{display:flex;gap:6px;flex-wrap:wrap}
.tkills .chip{background:#fff3cf}
.tkills b{font-family:var(--display);font-weight:400}
/* Interface des blocs */
.bhand{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 4px;flex:none;scrollbar-width:thin}
.bp{flex:none;position:relative;width:58px;height:58px;border-radius:12px;border:2.5px solid var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink);padding:0;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.bp canvas{width:44px;height:44px}
.bp.on{background:#bff59a;box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--gold)}
.bp .cnt{position:absolute;top:-8px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font-family:var(--display);font-size:13px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff3cf}
.bp.buy{width:auto;padding:0 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;font-family:var(--display);font-size:13px;line-height:1.1;background:linear-gradient(#fff3cf,#f2cf7c)}
.bp.buy .c{display:flex;align-items:center;gap:3px;font-size:15px}
.bp:disabled{opacity:.55;cursor:default}
.bp.buy{color:var(--ink);font-size:15px;letter-spacing:.03em;padding:0 12px;min-width:76px;gap:3px}
.bp.buy .c{font-family:var(--body);font-weight:900;font-size:17px}
.bp.buy .c .coin{width:15px;height:15px}
.bp.buy:disabled{opacity:1;background:#e9dcc0;color:#7a6650;box-shadow:0 3px 0 rgba(47,29,18,.5);border-color:rgba(47,29,18,.6)}
.bp.buy:disabled .c{color:#b3261e}
.bacts{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:7px}
.bacts .btn{font-size:16px;padding:9px 4px;display:flex;align-items:center;justify-content:center;gap:5px}
.bacts .btn.on{background:linear-gradient(#ffb3a3,#ef5a3c);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.bempty{font-size:14.5px;color:#6b4a2c;margin:0;line-height:1.35}
/* Typographie : la police d'affichage n'a qu'une graisse, on interdit le faux gras du navigateur */
html{font-synthesis:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.pill,.p-title,.tn,.en,.qn,.qh,.rw b,.card .n,.card .c,.btn,.tab,.unlock,.tkills b,.itm b,.gp b,.bp.buy,.actions .bcount,.bp .cnt,.banner,.sheet h1,.sheet h2,.sheet h3{font-weight:400}
b,strong{font-weight:900;color:var(--ink)}
.rw b,.t-stats b,.ecard .estats b,.tcard .ts b,.chip b,.tkills b,.itm b,.gp b{font-family:var(--body);font-weight:900;letter-spacing:0;font-variant-numeric:tabular-nums}
.rw b{font-size:18px}
.t-stats b,.ecard .estats b,.tcard .ts b{font-size:1.06em}
.pill,.p-title,.tn,.en,.qn,.qh,.btn,.tab{letter-spacing:.025em}
/* Si la police d'affichage ne se charge pas, on garde un texte bien gras */
html.nofont .pill,html.nofont .p-title,html.nofont .tn,html.nofont .en,html.nofont .qn,html.nofont .qh,html.nofont .card .n,html.nofont .card .c,html.nofont .btn,html.nofont .tab,html.nofont .unlock,html.nofont .bp.buy,html.nofont .actions .bcount,html.nofont .bp .cnt,html.nofont .banner{font-weight:800}
/* Boutique : lisibilité */
.tier-h{font-size:16px;margin-top:4px}
.tier-h small{font-size:13px;font-weight:800;color:#6b4a2c}
.tier-b{display:inline-block;background:var(--rc);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;padding:2px 10px;font-family:var(--display);font-size:16px;letter-spacing:.03em;box-shadow:0 2px 0 var(--ink)}
.relic{padding:8px;gap:4px}
.relic .rname{font-size:15.5px;letter-spacing:.02em;line-height:1.1}
.relic .rsub{font-size:12.5px;font-weight:900;color:#6b4a2c}
.relic .rdesc{font-size:12.5px;color:#5a3d22;line-height:1.3}
.relic.unk .rname{color:#8a7a62}
.rbar{height:16px}.rbar span{font-size:11px;line-height:12px;font-weight:900}
.relic .btn{font-size:14px;padding:6px 6px}
.g-txt .tn{font-size:20px;letter-spacing:.03em}
.g-txt .ts{font-size:13px;color:#efe4fa;line-height:1.3}
.g-btns .btn{font-size:15px;padding:7px 10px}
.gacha .btn:disabled{filter:grayscale(.35);opacity:.72}
.gp{padding:7px 3px;gap:2px}.gp b{font-size:20px;letter-spacing:.02em}.gp span{font-size:11.5px;font-weight:900;color:#b0245e;white-space:nowrap}
.gp .btn{font-size:14px;padding:4px 9px}.gp .btn:disabled{filter:none;opacity:1;color:var(--ink)}
.gemshop .tier-h{font-size:18px}
@media (max-width:380px){
  .app{padding-inline:10px}
  .hud{gap:4px}.pill{font-size:16px;padding:2px 8px 2px 3px}.pill .ico,.pill .ico svg{width:19px;height:19px}
  .hud .btn{font-size:15px;padding:5px 8px;min-width:36px}
  .actions{gap:6px}.actions .btn{font-size:15px;padding:0 8px;height:44px}.power{width:48px;height:48px}
  .actions .act-next{font-size:17px;height:48px}.actions .bcount{min-width:20px;height:20px;font-size:12px}
  .bacts .btn{font-size:14px}.panel{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){.banner,.btn{transition:none}.power.armed{animation:none}}

/* Agrandit chaque carte de 3 cases de chaque côté : les murs et rivières qui touchaient le bord se prolongent,
   les portails reculent jusqu'au nouveau bord par un couloir, et la bande ajoutée reçoit le décor du niveau. */
const DECOCH='thwbsnpfkaomuyjqlxgzv';
function expandMap(m,seed){
  const OC=m[0].length,OR=m.length,P=3,NC=OC+2*P,NR=OR+2*P,cl=(v,a,b)=>v<a?a:v>b?b:v;
  const isPortal=ch=>ch>='A'&&ch<='Z'&&ch!=='X',blocks=ch=>ch==='#'||ch==='~'||DECOCH.includes(ch);
  const pool=m.join('').split('').filter(ch=>DECOCH.includes(ch));
  const make=dens=>{let s=(seed*7919+13)%2147483647||1;const rnd=()=>(s=s*16807%2147483647)/2147483647;
    const g=[],fixed=new Set(),K=(c,r)=>r*NC+c;
    for(let r=0;r<NR;r++){const row=[];for(let c=0;c<NC;c++){const ch=m[cl(r-P,1,OR-2)][cl(c-P,1,OC-2)];row.push('dcrei'.includes(ch)?ch:'.')}g.push(row)}
    for(let r=1;r<OR-1;r++)for(let c=1;c<OC-1;c++){g[r+P][c+P]=m[r][c];fixed.add(K(c+P,r+P))}
    for(let r=0;r<OR;r++)for(let c=0;c<OC;c++){if(r>0&&r<OR-1&&c>0&&c<OC-1)continue;
      const ch=m[r][c],dx=c===0?-1:c===OC-1?1:0,dy=r===0?-1:r===OR-1?1:0;
      if(dx&&dy)continue;                       // coins : simple sol
      let x=c+P,y=r+P;
      if(isPortal(ch)){while(x>0&&x<NC-1&&y>0&&y<NR-1){fixed.add(K(x,y));x+=dx;y+=dy}g[y][x]=ch;fixed.add(K(x,y));continue}
      const inner=m[r-dy][c-dx];
      if(blocks(inner)){const e=inner==='~'?'~':'#';while(x>=0&&x<NC&&y>=0&&y<NR){g[y][x]=e;fixed.add(K(x,y));x+=dx;y+=dy}}}
    for(let r=0;r<NR;r++)for(let c=0;c<NC;c++)if((r===0||c===0||r===NR-1||c===NC-1)&&!isPortal(g[r][c])&&g[r][c]!=='~')g[r][c]='#';
    for(let r=1;r<NR-1;r++)for(let c=1;c<NC-1;c++){if(fixed.has(K(c,r)))continue;
      let nearFix=false;for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const ch=g[r+b][c+a];if(isPortal(ch))nearFix=true}
      if(!nearFix&&rnd()<dens)g[r][c]=pool.length&&rnd()<.75?pool[(rnd()*pool.length)|0]:'#'}
    return g};
  const ok=g=>{const seen=new Set(),q=[];for(let r=0;r<NR;r++)for(let c=0;c<NC;c++)if(isPortal(g[r][c])){q.push([c,r]);seen.add(r*NC+c)}
    let hit=false;while(q.length){const[c,r]=q.pop();if(g[r][c]==='X'){hit=true;continue}
      for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+a,nr=r+b;if(nc<0||nr<0||nc>=NC||nr>=NR)continue;const k=nr*NC+nc,ch=g[nr][nc];
        if(seen.has(k)||blocks(ch))continue;seen.add(k);q.push([nc,nr])}}
    // chaque portail doit atteindre le cristal
    const ports={};for(let r=0;r<NR;r++)for(let c=0;c<NC;c++)if(isPortal(g[r][c]))(ports[g[r][c]]=ports[g[r][c]]||[]).push([c,r]);
    return hit&&Object.values(ports).every(ps=>ps.some(([c,r])=>reach(g,c,r)))};
  const reach=(g,c0,r0)=>{const seen=new Set([r0*NC+c0]),q=[[c0,r0]];while(q.length){const[c,r]=q.pop();if(g[r][c]==='X')return true;
      for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+a,nr=r+b;if(nc<0||nr<0||nc>=NC||nr>=NR)continue;const k=nr*NC+nc;
        if(seen.has(k)||blocks(g[nr][nc]))continue;seen.add(k);q.push([nc,nr])}}return false};
  for(let t=0;t<12;t++){const g=make(.1);if(ok(g))return g.map(r=>r.join(''));seed+=101}
  return make(0).map(r=>r.join(''))}
/* Chaque niveau a sa propre disposition : carte retournée, cristal déplacé (avec le décor qui l'entoure),
   portails replacés loin du cristal. */
const LAYOUTS=[
  ['base','H','BL','BR','H','base','L','V','TL'],
  ['V','V','V','BL','TR','BR','V','R','base'],

  ['BR','L','V','TL','TR','BL','R','TL','V'],

const PORTAL_MIN=16;   // distance minimale (en cases) entre un portail et le cristal

// Force de départ de chaque biome : le Château démarre plus doucement (≈ niveau 3 de la Plaine)
function genWaves(L){const n=waveCount(L,DIFFKEY),st=DIFFKEY==='facile'?facStart(L):Math.round(L*1.4)+BIOME.tier*6,out=[];
  const ro=t=>BIOME.roster[t]||t,map=gs=>gs.map(x=>Object.assign({},x,{t:ro(x.t)}));
  // Mode histoire : pas de mini-boss avant la vague 5 (on prend la vague précédente du tableau, sans dragon)
  for(let i=0;i<n;i++){let k=st+i;if(k>19)k=10+(k-10)%10;if(i<4&&WAVES[k].some(x=>x.t==='dragon'))k--;out.push({groups:map(WAVES[k]),str:st+i+1})}
  // Vague du boss (posée avant les réglages Facile pour qu'ils s'appliquent aussi à elle)
  if(LEVELS[L].boss)out[n-1]={groups:map([g('wyv',8,.8),g('troll',4,2,3),g('drake',1,0,7)]),str:st+n+2};
  // Mine abandonnée (Grottes 3) en Facile : 20 % de golems de pierre en moins dans chaque vague
  if(DIFFKEY==='facile'&&BIOME.tier===2&&L===2){const cf=DIFF.facile.count;for(const w of out)w.groups=w.groups.map(g=>g.t!=='golem'?g:Object.assign({},g,{n:Math.max(1,Math.round(Math.max(1,Math.round(g.n*cf))*.8))/cf}));
    // vague 1 : encore 4 golems de moins
    {const cf2=DIFF.facile.count;out[0].groups=out[0].groups.map(g=>g.t!=='golem'?g:Object.assign({},g,{n:Math.max(1,Math.max(1,Math.round(g.n*cf2))-4)/cf2}))}}
  // Désert 8 en Facile : vague 1 avec 2 golems de sable en moins
  if(DIFFKEY==='facile'&&BIOME.tier===3&&L===7){const cf3=DIFF.facile.count;out[0].groups=out[0].groups.map(g=>g.t!=='sandgolem'?g:Object.assign({},g,{n:Math.max(1,Math.round(g.n*cf3)-2)/cf3}))}
  // Équilibrage Facile niveau par niveau (testé avec un joueur débutant) : multiplicateur de vie des monstres
  if(DIFFKEY==='facile'){const f=FAC_FIX[gIdx(L)];if(f)for(const w of out)w.hm=(w.hm||1)*f;
    // Début de niveau plus doux en Facile : les premières vagues arrivent moins fortes, le temps de poser ses tours
    out.forEach((w,i)=>{const r=FAC_RAMP[i];if(r)w.hm=(w.hm||1)*r})}
  return out}

/* ---------- Toucher le terrain : toucher = action, glisser = déplacer la vue, pincer = zoomer ---------- */
function toWorld(ev){const r=cvs.getBoundingClientRect();return{x:VX+(ev.clientX-r.left)/r.width*W/VZ,y:VY+(ev.clientY-r.top)/r.height*H/VZ}}
function cellAt(ev){const{x,y}=toWorld(ev);const c=Math.floor(x/C),rr=Math.floor(y/C);return{x,y,i:c>=0&&c<COLS&&rr>=0&&rr<ROWS?idx(c,rr):-1}}
function tapAt(ev){if(S.over||!overlay.hidden)return;const{x,y,i}=cellAt(ev);if(i<0)return;
  if(S.power.armed){castPower(x,y);updateHud(true);return}
  if(S.blockMode){
    if(S.bdel){if(block[i]){demolishAt(i)}else floatText(cx(i),cy(i),'Pas une forme posée','#ffb3a3',13);panelKey='';renderPanel();updateHud(true);return}
    if(!S.hand.length){floatText(x,y,'Plus de blocs','#ef5a3c',13);return}const c=colOf(i),r=rowOf(i);
    if(S.ghost&&S.ghost.c===c&&S.ghost.r===r)placeGhost();else setGhost(c,r);panelKey='';renderPanel();updateHud(true);return}
  if(S.towerMode){let j=i;const below=i+COLS;if(!S.towers[i]&&!buildable(i)&&below<N&&S.towers[below])j=below;
    if(S.tpick&&!towerUnlocked(S.tpick))S.tpick=null;if(S.towers[j]){S.towerMode=false;S.sel={kind:'cell',i:j};panelKey='';renderPanel();updateHud(true);return}
    if(buildable(j)){if(!S.tpick)floatText(cx(j),cy(j)-6,"Choisis d'abord une tour",'#f3d08c',13);else buildTower(j,S.tpick);panelKey='';renderPanel();updateHud(true);return}
    floatText(cx(i),cy(i),base[i]==='ground'?'Pose un bloc ici':'Pas ici','#f3d08c',13);return}
  let sel=null;
  if(base[i]==='crystal'||Math.hypot(x-CRY.x,y-(CRY.y-20))<30)sel={kind:'crystal'};
  else{let j=i;const below=i+COLS;if(!S.towers[i]&&!buildable(i)&&below<N&&S.towers[below])j=below;
    if(S.towers[j])sel={kind:'cell',i:j};
    else if(buildable(j)){toggleTowers(true);return}
    else if(base[i]==='ground')floatText(cx(i),cy(i),'Pose un bloc ici','#f3d08c',13);else if(base[i]==='edge')floatText(cx(i),cy(i),'Hors du terrain','#f3d08c',13)}
  if(sel&&S.sel&&sel.kind===S.sel.kind&&sel.i===S.sel.i)sel=null;
  S.sel=sel;panelKey='';renderPanel()}
const ptrs=new Map();let gest=null;
// Clic droit : tourne la forme de bloc sélectionnée (et ne pose rien)
function rotatePick(){if(!S.blockMode||S.bdel||S.over)return;const p=S.hand[S.pick];if(!p)return;p.cells=rotCells(p.cells);if(S.ghost)setGhost(S.ghost.c,S.ghost.r);panelKey='';renderPanel()}
cvs.addEventListener('contextmenu',ev=>ev.preventDefault());
cvs.addEventListener('pointerdown',ev=>{if(!overlay.hidden)return;if(ev.button===2){ev.preventDefault();rotatePick();return}try{cvs.setPointerCapture(ev.pointerId)}catch(_){}
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY,sx:ev.clientX,sy:ev.clientY});if(S.power.armed){const w=toWorld(ev);S.aim={x:w.x,y:w.y}}
  if(ptrs.size===1)gest={moved:0,pinch:false};
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];gest={moved:99,pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:VZ}}});
cvs.addEventListener('pointermove',ev=>{
  if(S.power.armed){const w=toWorld(ev);S.aim={x:w.x,y:w.y};if(ptrs.has(ev.pointerId)){const p=ptrs.get(ev.pointerId);p.x=ev.clientX;p.y=ev.clientY}return}
  if(!ptrs.has(ev.pointerId)&&S.towerMode&&ev.pointerType==='mouse'){const{i}=cellAt(ev);S.hover=i;return}
  if(!ptrs.has(ev.pointerId)&&S.blockMode&&S.bdel&&ev.pointerType==='mouse'){const{i}=cellAt(ev);S.delHover=i;return}
  if(!ptrs.has(ev.pointerId)){if(S.blockMode&&!S.bdel&&ev.pointerType==='mouse'&&S.hand.length){const{i}=cellAt(ev);if(i>=0){const c=colOf(i),r=rowOf(i);if(!S.ghost||S.ghost.c!==c||S.ghost.r!==r){setGhost(c,r);panelKey='';renderPanel()}}}return}
  const p=ptrs.get(ev.pointerId),dx=ev.clientX-p.x,dy=ev.clientY-p.y;p.x=ev.clientX;p.y=ev.clientY;const rc=cvs.getBoundingClientRect();
  if(gest&&gest.pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const w=toWorld({clientX:mx,clientY:my});zoomAt(gest.z*Math.hypot(a.x-b.x,a.y-b.y)/gest.d,w.x,w.y);return}
  if(!gest)return;gest.moved+=Math.abs(dx)+Math.abs(dy);
  // En mode Blocs, glisser le doigt déplace l'aperçu de la forme (et du chemin des monstres) au lieu de la vue
  if(S.blockMode&&!S.bdel&&S.hand.length&&!gest.pinch){if(gest.moved>6){const{i}=cellAt(ev);if(i>=0){const c=colOf(i),r=rowOf(i);if(!S.ghost||S.ghost.c!==c||S.ghost.r!==r){setGhost(c,r);panelKey='';renderPanel()}}}return}
  if(gest.moved>10&&VZ>1){VX-=dx/rc.width*W/VZ;VY-=dy/rc.height*H/VZ;clampView()}});
const endPtr=ev=>{const had=ptrs.has(ev.pointerId);ptrs.delete(ev.pointerId);
  if(had&&gest&&!gest.pinch&&ev.type==='pointerup'&&(gest.moved<=10||S.power.armed))tapAt(ev);
  if(!ptrs.size)gest=null;else if(gest&&gest.pinch&&ptrs.size===1)gest={moved:99,pinch:false}};
cvs.addEventListener('pointerleave',()=>{S.delHover=-1});cvs.addEventListener('pointerup',endPtr);cvs.addEventListener('pointercancel',endPtr);
cvs.addEventListener('wheel',ev=>{ev.preventDefault();const w=toWorld(ev);zoomAt(VZ*(ev.deltaY<0?1.15:.87),w.x,w.y)},{passive:false});

const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function dailyQ(){const k=dayKey();let q=META.dq;
  if(!q||q.day!==k){let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;const pool=DAILY.map(x=>x.id).filter(id=>id!=='ewave'||endlessUnlocked()),ids=[];
    while(ids.length<3){h=(h*1103515245+12345)>>>0;const j=h%pool.length;ids.push(pool.splice(j,1)[0])}
    q=META.dq={day:k,ids,p:{},claimed:[],bonus:false}}
  // Quête « mode infini » remplacée tant que le mode infini est verrouillé
  if(!endlessUnlocked()&&q.ids.includes('ewave')){const alt=DAILY.map(x=>x.id).find(id=>id!=='ewave'&&!q.ids.includes(id));if(alt)q.ids[q.ids.indexOf('ewave')]=alt}
  return q}
function stat(k,n=1){META.st=META.st||{};META.st[k]=(META.st[k]||0)+n;const q=dailyQ();q.p[k]=(q.p[k]||0)+n}
const achVal=(a,t=achTier(a))=>a.get?a.get(t):((META.st||{})[a.stat]||0);
const achTier=a=>(META.ach||{})[a.id]||0;
function questReady(){const q=dailyQ();let n=0;
  for(const id of q.ids){const d=DAILY.find(x=>x.id===id);if(!q.claimed.includes(id)&&(q.p[d.stat]||0)>=d.n)n++}
  if(!q.bonus&&q.claimed.length===3)n++;
  for(const a of ACH){const t=achTier(a);if(t<a.tiers.length&&achVal(a)>=a.tiers[t])n++}
  return n}
const questBadge=()=>{const n=questReady();return n?`<span class="qbadge">${n}</span>`:''};
function claimDaily(id){const q=dailyQ();
  if(id==='bonus'){if(q.bonus||q.claimed.length<3)return;q.bonus=true;META.gems=(META.gems||0)+DAILY_BONUS}
  else{const d=DAILY.find(x=>x.id===id);if(!d||q.claimed.includes(id)||(q.p[d.stat]||0)<d.n)return;q.claimed.push(id);META.scales+=d.sc}
  saveMeta();const y=overlay.scrollTop;showQuests();overlay.scrollTop=y}
function claimAch(id){const a=ACH.find(x=>x.id===id),t=achTier(a);if(t>=a.tiers.length||achVal(a)<a.tiers[t])return;
  META.ach=META.ach||{};META.ach[id]=t+1;META.gems=(META.gems||0)+ACH_RW[t].gems;
  saveMeta();const y=overlay.scrollTop;showQuests();overlay.scrollTop=y}
const qbar=(v,n)=>`<div class="qbar"><i style="width:${Math.min(100,v/n*100)}%"></i><span>${Math.min(v,n)} / ${n}</span></div>`;
function showQuests(){const q=dailyQ();
  const now=new Date(),mid=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1),hl=Math.floor((mid-now)/3600000),ml=Math.floor((mid-now)/60000)%60;
  const daily=q.ids.map(id=>{const d=DAILY.find(x=>x.id===id),v=q.p[d.stat]||0,done=q.claimed.includes(id),ok=v>=d.n;
    return`<div class="qcard${done?' done':''}"><div class="qb"><div class="qn">${d.txt}</div>${qbar(v,d.n)}</div>
      <button class="btn ${ok&&!done?'green':''}" data-qd="${id}" ${ok&&!done?'':'disabled'}>${done?'Reçu ✓':`${ICON.scale}${d.sc}`}</button></div>`}).join('');
  const all=q.claimed.length;
  const bonus=`<div class="qcard bonus${q.bonus?' done':''}"><div class="qb"><div class="qn">Finir les 3 quêtes du jour</div>${qbar(all,3)}</div>
      <button class="btn ${all>=3&&!q.bonus?'green':''}" data-qd="bonus" ${all>=3&&!q.bonus?'':'disabled'}>${q.bonus?'Reçu ✓':`${ICON.gem}${DAILY_BONUS}`}</button></div>`;
  const ach=ACH.map(a=>{const t=achTier(a),max=t>=a.tiers.length,n=a.tiers[Math.min(t,a.tiers.length-1)],v=achVal(a,t),ok=!max&&v>=n,rw=ACH_RW[Math.min(t,3)];
    return`<div class="qcard${max?' done':''}"><div class="qb"><div class="qn">${a.name} <span class="qstars">${a.tiers.map((_,k)=>`<i class="${k<t?'on':''}"></i>`).join('')}</span></div>
      <div class="qs">${max?'Toutes les étapes sont terminées':a.txt(n,t)}</div>${max?'':qbar(v,n)}</div>
      <button class="btn ${ok?'green':''} qrw" data-qa="${a.id}" ${ok?'':'disabled'}>${max?'Fini ✓':`<span>${ICON.gem}${rw.gems}</span>`}</button></div>`}).join('');
  open(`<div class="top"><button class="btn back" data-nav="home">← Menu</button><h2>Quêtes</h2></div>${curPills()}
    <h3 class="qh">Quêtes du jour <small>nouvelles dans ${hl} h ${ml} min</small></h3><div class="stack">${daily}${bonus}</div>
    <h3 class="qh">Succès</h3><div class="stack">${ach}</div>
    <p class="note">Les quêtes du jour changent chaque jour à minuit. Chaque succès a 4 étapes, de plus en plus difficiles.</p>`,'quests')}

function endlessPhase(n){if(n<=10)return{name:'Facile',hp:.85,count:DIFF.facile.count,speed:DIFF.facile.speed,rw:1};
  if(n<=20)return{name:'Normal',hp:DIFF.normal.hp,count:DIFF.normal.count,speed:DIFF.normal.speed,rw:1.5};
  if(n<=30)return{name:'Difficile',hp:DIFF.difficile.hp,count:DIFF.difficile.count,speed:DIFF.difficile.speed,rw:2.2};
  const x=n-30;return{name:'Difficile +'+x,hp:DIFF.difficile.hp*Math.pow(1.06,x),count:Math.min(4,DIFF.difficile.count*(1+.02*x)),speed:Math.min(2.5,DIFF.difficile.speed+(2.5-DIFF.difficile.speed)*x/70),rw:2.2+.03*x}}
function genEndless(){const ro=t=>BIOME.roster[t]||t,map=gs=>gs.map(x=>Object.assign({},x,{t:ro(x.t)})),out=[];
  for(let n=1;n<=400;n++){const gs=WAVES[(n-1)%20].filter(x=>x.t!=='dragon'&&x.t!=='drake').map(x=>Object.assign({},x));
    if(n%10===0)gs.push(g('drake',1+Math.floor(n/50),6,6));else if(n%5===0)gs.push(g('dragon',1+Math.floor(n/30),4,4));if(!gs.length)gs.push(g('gob',10,.6));
    out.push({groups:map(gs),str:1+Math.round(n*.6),ph:endlessPhase(n)})}return out}

function endGame(won,quit,cash){if(S.over)return;if(S.endless){S.over=true;S.sel=null;S.blockMode=false;cvs.classList.remove('blockmode');panelKey='';renderPanel();endEndless(quit,cash);return}if(S.over)return;S.over=true;S.won=won;S.sel=null;S.blockMode=false;cvs.classList.remove('blockmode');panelKey='';renderPanel();
  const cl=Object.keys(S.cleared).length,m=REWARD_MULT[DIFFKEY],L=LEVEL,lv=LEVELS[L],d=DIFFKEY;

  const first=won&&L>=PR()[d];
  const stars=won?(S.crystal.hp/S.crystal.max>=.8?3:S.crystal.hp/S.crystal.max>=.4?2:1):0;
  const ru=won?(lv.boss?4:1)+(first?1:0):0;
  let unlock='';
  let gem3=0;if(won&&stars===3&&((ST()[d]||[])[L]||0)<3)gem3=5;META.gems=(META.gems||0)+gem3;
  if(won){if(d==='difficile'&&!S.hit){META.flaw=META.flaw||{};const fl=META.flaw[BIOME.id]=META.flaw[BIOME.id]||[];if(!fl.includes(L))fl.push(L)}stat('win');if(stars===3)stat('star3');if(lv.boss)stat('bosswin');ST()[d][L]=Math.max(ST()[d][L]||0,stars);
    if(first){PR()[d]=L+1;if(lv.boss){const nd=DIFF_ORDER[DIFF_ORDER.indexOf(d)+1];unlock=nd?`Biome terminé ! La difficulté ${DIFF[nd].label} est débloquée.`:'Biome terminé dans toutes les difficultés !';if(nd){SELD=nd;META.lastDiff=nd}const bi=BIOMES.indexOf(BIOME);if(d==='facile'&&BIOMES[bi+1])unlock+=` Nouveau biome : ${BIOMES[bi+1].name} !`;if(d==='facile'){const nt=ORDER.find(k=>TOWER_UNLOCK[k]===bi);if(nt)unlock+=` Nouvelle tour : ${TOWERS[nt].name} !`;if(bi===LV4_BIOME)unlock+=' Les tours peuvent maintenant passer au niveau 4, et le mode infini est débloqué !'}}}}
  META.scales+=sc;META.runes+=ru;META.games++;saveMeta();
  const title=won?`<h2 style="color:var(--gold)">${lv.boss?ENEMIES[BIOME.roster.drake||'drake'].name+' est vaincu !':'Victoire !'}</h2>`:quit?'<h2>Niveau abandonné</h2>':'<h2 style="color:var(--red)">Le cristal est brisé…</h2>';
  const bi=BIOMES.indexOf(BIOME),nb=BIOMES[bi+1];
  const next=won&&L+1<LEVELS.length?`<button class="btn go" data-play="${L+1}" data-focus>Niveau suivant</button>`:won&&lv.boss&&nb&&biomeUnlocked(bi+1)?`<button class="btn go" data-biome="${bi+1}" data-focus>Biome suivant : ${nb.name}</button>`:'';
  setTimeout(()=>open(`${title}${won?starRow(stars).replace('class="stars"','class="stars big"'):''}<p>${lv.name} · ${cl}/${S.waves.length} vagues repoussées · ${DIFF[d].label}.</p>
    ${unlock?`<div class="unlock">${unlock}</div>`:''}
    <div class="rewards"><div class="rw">${ICON.scale} Écailles de dragon <b>+${sc}</b></div><div class="rw">${ICON.rune} Runes <b>+${ru}</b></div>${gem3?`<div class="rw">${ICON.gem} Gemmes (3 étoiles) <b>+${gem3}</b></div>`:''}</div>
    <div class="stack">${next}<button class="btn ${next?'':'go'}" data-play="${L}" ${next?'':'data-focus'}>Rejouer</button><button class="btn" data-nav="armory">Améliorer les tours</button><button class="btn" data-nav="biome">Carte du biome</button><button class="btn" data-nav="home">Menu principal</button></div>`,'results'),quit?0:800)}

 {txt:()=>"Voici le <b>cristal du dragon</b>. Les monstres veulent le détruire : s'il tombe à 0 PV, la partie est perdue.",at:()=>wRect(CRY.x,CRY.y-10,42)},
 {txt:()=>"Les monstres sortent des <b>portails</b> et suivent le chemin en pointillés jusqu'au cristal.",
  at:()=>{const cs=[].concat(...Object.values(portalCells));let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const c of cs){x0=Math.min(x0,cx(c));y0=Math.min(y0,cy(c));x1=Math.max(x1,cx(c));y1=Math.max(y1,cy(c))}return wRect((x0+x1)/2,(y0+y1)/2,(x1-x0)/2+22,(y1-y0)/2+22)}},
 {txt:()=>"Ici, tu vois les monstres de la <b>prochaine vague</b>. Touche un nom pour voir sa fiche.",at:()=>elRect('#panel .enemy-list')},
 {txt:()=>!S.towerMode?"Pose ta première tour : touche <b>Tours</b>.":!S.tpick?"Choisis l'<b>Archer</b>.":"Touche maintenant un <b>décor</b> (buisson, rocher…) ou un <b>mur</b> près du chemin pour y bâtir l'Archer.",
  at:()=>!S.towerMode?elRect('#twBtn'):!S.tpick?elRect('#panel [data-type="archer"]'):null,light:()=>S.towerMode&&!!S.tpick,done:()=>firstTower()>=0},
 {enter:()=>{const i=firstTower();if(S.towerMode)toggleTowers(false);S.sel={kind:'cell',i};panelKey='';renderPanel()},

 {when:()=>S.enemies.length>0&&!powerBtn.disabled,pause:true,

 {when:()=>!!S.cleared[1],pause:true,txt:()=>"Vague repoussée ! Chaque monstre tué rapporte de l'<b>or</b>. Touche ta tour pour l'<b>améliorer</b>, la <b>vendre</b> ou changer sa <b>cible</b>. Tu gagnes aussi de nouvelles formes de blocs à chaque vague.",

// replay=true : tuto relancé depuis le menu ⚙️ (seul cas où on peut le passer)
let TUT_REPLAY=false;
function tutStart(replay){TUT={i:0,shown:false,replay:!!replay};tutEl.hidden=false;$('#tskip').style.display=replay?'':'none'}
// done=true : tuto fini ou passé (ne se relance plus tout seul)
function tutStop(done){if(TUT&&TUT.paused)S.paused=false;TUT=null;tutEl.hidden=true;if(done){META.tutoDone=1;saveMeta()}}
function tutNext(){if(TUT.paused){S.paused=false;TUT.paused=false}TUT.i++;TUT.shown=false;if(TUT.i>=TUT_STEPS.length)tutStop(true)}
function tutTick(){if(!TUT)return;if(S.over||S.endless){tutStop(false);return}const st=TUT_STEPS[TUT.i];
  if(!TUT.shown){if(st.when&&!st.when()){tutEl.hidden=true;return}TUT.shown=true;if(st.enter)st.enter();if(st.pause){S.paused=true;TUT.paused=true}}
  if(!overlay.hidden){tutEl.hidden=true;return}tutEl.hidden=false;
  if(st.onTick)st.onTick();
  if(st.done&&st.done()){tutNext();return}
  const tx=st.txt();if(TUT.tx!==tx){TUT.tx=tx;$('#ttxt').innerHTML=tx}$('#tstep').textContent=`Tuto · ${TUT.i+1}/${TUT_STEPS.length}`;
  $('#tnext').style.display=st.done?'none':'';$('#tnext').textContent=TUT.i===TUT_STEPS.length-1?'Terminer':'Suivant';
  tutEl.classList.toggle('light',!!(st.light&&st.light()));
  const r=st.at&&st.at(),vw=innerWidth,vh=innerHeight,bw=tBub.offsetWidth,bh=tBub.offsetHeight;
  if(r){tSpot.classList.remove('none');tSpot.style.borderRadius=st.round?'50%':'';Object.assign(tSpot.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
    let top=r.top+r.height+12;if(top+bh>vh-8)top=r.top-bh-12;if(top<8)top=Math.min(vh-bh-8,Math.max(8,r.top+r.height/2-bh/2));
    const left=Math.max(12,Math.min(vw-bw-12,r.left+r.width/2-bw/2));tBub.style.left=left+'px';tBub.style.top=top+'px'}
  else{tSpot.classList.add('none');const lt=st.light&&st.light(),sr=(lt?$('#panel'):$('#stage')).getBoundingClientRect();tBub.style.left=Math.max(12,(vw-bw)/2)+'px';tBub.style.top=Math.max(8,lt?Math.min(vh-bh-8,sr.top+4):sr.top+10)+'px'}}
